<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoForge - Mobile Video Editor</title>
    <meta name="description" content="Mobile multi-track timeline video editor for creators with Whisper speech-to-text, TTS voice-overs, auto-captions, effects, transitions, and FFmpeg rendering." />
    <meta property="og:title" content="VideoForge - Mobile Video Editor" />
    <meta property="og:description" content="Mobile multi-track timeline video editor for creators with Whisper speech-to-text, TTS voice-overs, auto-captions, effects, transitions, and FFmpeg rendering." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VideoForge" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="alternate" type="application/manifest+json" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
